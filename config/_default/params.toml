# PaperMod Theme Options
# https://github.com/adityatelange/hugo-PaperMod

env = "production"
title = "Nurasyl's ML Blog"
description = "Documenting my ML engineering journey"
author = "Nurasik12"
defaultTheme = "auto" # dark, light, auto
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = false
tocopen = false

[profileMode]
  enabled = true
  title = "Nurasik12"
  subtitle = "CS student at CityUHK | ML & AI"
  imageUrl = "https://github.com/nurasik14.png"
  imageTitle = "Nurasik12"
  imageWidth = 120
  imageHeight = 120
  buttons = [
    { name = "GitHub", url = "https://github.com/nurasik14" },
    { name = "Posts", url = "Learning-Blog/posts" },
  ]

[[socialIcons]]
  name = "github"
  url = "https://github.com/nurasik14"
[[socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/nurasik12"
[[socialIcons]]
  name = "instagram"
  url = "https://instagram.com/nurasik.12"

[homeInfoParams]
  Title = "Hi, I'm Nurasik"
  Content = "Documenting my ML engineering journey | Preparing for Google PMLE | CS student at CityUHK"

[analytics]
  [analytics.google]
    SiteVerificationTag = ""
