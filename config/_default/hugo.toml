# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://nurasik14.github.io/ProgressDoc"
publishDir = "public"
defaultContentLanguage = "en"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 40

buildDrafts = false
buildFuture = false

enableEmoji = true

googleAnalytics = "G-QB2V7XDQG2"

title = "My Progressiong Documentation"

[params.author]
  name = "Nurasik12"
  image = "img/author.jpg"
  headline = "Not a human, nor sane creature"
  bio = "A little bit about me"
  links = [
    { github = "https://github.com/nurasik14" },
    { linkedin = "https://linkedin.com/in/username" },
    { instagram = "https://instagram.com/nurasik.12" },
  ]


[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Smart'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10

[services]
  [services.disqus]
    shortname = 'Nurasik'

[privacy]
  [privacy.disqus]
    disable = false
