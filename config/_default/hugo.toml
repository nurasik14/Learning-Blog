# -- Site Configuration --
baseURL = "https://nurasik14.github.io/Learning-Blog"
title = "Nurasyl's ML Blog"
theme = "reimu"
publishDir = "docs"
defaultContentLanguage = "en"
languageCode = "en-us"

enableRobotsTXT = true
summaryLength = 40
buildDrafts = false
buildFuture = false
enableEmoji = true
googleAnalytics = "G-QB2V7XDQG2"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
