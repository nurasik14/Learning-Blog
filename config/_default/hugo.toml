# -- Site Configuration --
baseURL = "https://nurasik14.github.io/Learning-Blog"
title = "Nurasyl's ML Blog"
theme = "PaperMod"
publishDir = "docs"
defaultContentLanguage = "en"
languageCode = "en-us"

enableRobotsTXT = true
summaryLength = 40
buildDrafts = false
buildFuture = false
enableEmoji = true
googleAnalytics = "G-QB2V7XDQG2"

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Smart'

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    hl_inline = false
    lineAnchors = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = "monokai"
    tabWidth = 4
